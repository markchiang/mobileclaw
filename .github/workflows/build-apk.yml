name: Build & Release APK

on:
  push:
    tags:
      - 'v*.*.*'   # 例如 v1.0.0、v1.2.3

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK
      run: sdkmanager --install 'ndk;27.0.12077973'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: stable

    - name: Install Flutter dependencies
      working-directory: mobileclaw_app
      run: flutter pub get

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build Release APK
      working-directory: mobileclaw_app
      run: flutter build apk --release

    - name: Upload Release APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: mobileclaw_app/build/app/outputs/flutter-apk/*.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: success()         # 只在前面步驟成功時執行
      with:
        files: mobileclaw_app/build/app/outputs/flutter-apk/*.apk
        generate_release_notes: true
      env:

        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
